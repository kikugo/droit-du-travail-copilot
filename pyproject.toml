[project]
name = "droit-du-travail-copilot"
version = "0.1.0"
description = "French labour-law RAG agent on Azure AI Foundry"
readme = "README.md"
authors = [
    { name = "Karthik Reddy Changal", email = "83645138+kikugo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.23,<2",
    "agent-framework-foundry>=1.15,<2",
    "azure-identity>=1.26.0",
    "azure-search-documents>=12,<13",
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "opentelemetry-sdk>=1.45.1",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
